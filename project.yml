name: Everyring
options:
  bundleIdPrefix: dk.erik
  developmentLanguage: en
  deploymentTarget: { iOS: "27.0", watchOS: "27.0" }
settings:
  base:
    # The same version numbers for all targets (Apple requires it for the watch app and extensions).
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    # English only for v1, but all strings go through String Catalogs so languages can be added later.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  # iPhone + iPad app. Widget and Watch targets are added in later milestones.
  Everyring:
    type: application
    platform: iOS
    sources: [Everyring, Shared]
    entitlements:
      path: Everyring/Everyring.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups: [group.dk.erik.everyring]
    info:
      path: Everyring/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en]
        ITSAppUsesNonExemptEncryption: false
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Everyring
        CFBundleURLTypes:
          - CFBundleURLName: dk.erik.everyring
            CFBundleURLSchemes: [everyring]
        NSHealthShareUsageDescription: "Everyring reads the Health data your rings use, such as steps, workouts and sleep, to show your progress. Your data never leaves your device."
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.erik.everyring
        TARGETED_DEVICE_FAMILY: "1,2"

  EveryringTests:
    type: bundle.unit-test
    platform: iOS
    sources: [EveryringTests]
    dependencies: [{ target: Everyring }]
    settings:
      base: { GENERATE_INFOPLIST_FILE: YES }
