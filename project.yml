name: Everyring
options:
  bundleIdPrefix: dk.erik
  developmentLanguage: en
  deploymentTarget: { iOS: "27.0", watchOS: "26.0" }
settings:
  base:
    # The same version numbers for all targets (Apple requires it for the watch app and extensions).
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "35"
    # English only for v1, but all strings go through String Catalogs so languages can be added later.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  # iPhone + iPad app. Embeds the widget extension and the Apple Watch app.
  Everyring:
    type: application
    platform: iOS
    sources: [Everyring, Shared]
    entitlements:
      path: Everyring/Everyring.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.dk.erik.everyring]
    info:
      path: Everyring/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en]
        ITSAppUsesNonExemptEncryption: false
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Everyring
        CFBundleURLTypes:
          - CFBundleURLName: dk.erik.everyring
            CFBundleURLSchemes: [everyring]
        NSHealthShareUsageDescription: "Everyring reads the Health data your rings use, such as steps, workouts and sleep, to show your progress. Your data never leaves your device."
        # Required by App Store Connect for HealthKit apps even though Everyring never writes to Health.
        NSHealthUpdateUsageDescription: "Everyring doesn’t save anything in Health: it only reads the data your rings use."
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    dependencies:
      - target: EveryringWidget
      - target: EveryringWatch
      - target: EveryringScreenTimeMonitor
      - target: EveryringScreenTimeReport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.erik.everyring
        TARGETED_DEVICE_FAMILY: "1,2"
        # Offers medical, reproductive and symptom types in the metric list (Shared/SensitiveMetrics.swift). For
        # TestFlight only: remove this line before an App Store release unless it is decided they may stay.
        # SCREEN_TIME: Screen Time rings (Family Controls, approved by Apple; see EveryringScreenTimeMonitor).
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SENSITIVE_METRICS SCREEN_TIME"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Home Screen and Lock Screen widgets (iPhone + iPad). Draw from the App Group cache; no HealthKit access.
  EveryringWidget:
    type: app-extension
    platform: iOS
    sources: [EveryringWidget, WidgetShared, Shared]
    entitlements:
      path: EveryringWidget/EveryringWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.dk.erik.everyring]
    info:
      path: EveryringWidget/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en]
        CFBundleDisplayName: Everyring
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.erik.everyring.widget
        TARGETED_DEVICE_FAMILY: "1,2"

  # Apple Watch app: receives ring sets from the iPhone, computes progress from the watch's own Health data and caches
  # it for the complications.
  EveryringWatch:
    type: application
    platform: watchOS
    sources:
      - EveryringWatch
      - Shared
      - Everyring/HealthManager.swift
      - Everyring/ProgressUpdater.swift
      - Everyring/RingsModel.swift
    entitlements:
      path: EveryringWatch/EveryringWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups: [group.dk.erik.everyring]
    info:
      path: EveryringWatch/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en]
        CFBundleDisplayName: Everyring
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: dk.erik.everyring
        CFBundleURLTypes:
          - CFBundleURLName: dk.erik.everyring.watchkitapp
            CFBundleURLSchemes: [everyring]
        NSHealthShareUsageDescription: "Everyring reads the Health data your rings use, such as steps, workouts and sleep, to show your progress on your watch. Your data never leaves your devices."
        NSHealthUpdateUsageDescription: "Everyring doesn’t save anything in Health: it only reads the data your rings use."
    dependencies:
      - target: EveryringWatchWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.erik.everyring.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Complications (WidgetKit accessory families) on the watch face.
  EveryringWatchWidget:
    type: app-extension
    platform: watchOS
    sources: [EveryringWatchWidget, WidgetShared, Shared]
    entitlements:
      path: EveryringWatchWidget/EveryringWatchWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.dk.erik.everyring]
    info:
      path: EveryringWatchWidget/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en]
        CFBundleDisplayName: Everyring
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.erik.everyring.watchkitapp.widget

  # Screen Time monitor (DeviceActivityMonitor): records each Screen Time ring's minutes at thresholds into the App
  # Group. Needs the Family Controls (Distribution) entitlement, like the app.
  EveryringScreenTimeMonitor:
    type: app-extension
    platform: iOS
    sources: [EveryringScreenTimeMonitor, Shared/ScreenTime]
    entitlements:
      path: EveryringScreenTimeMonitor/EveryringScreenTimeMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.dk.erik.everyring]
    info:
      path: EveryringScreenTimeMonitor/Info.plist
      properties:
        CFBundleDisplayName: Everyring Screen Time
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ScreenTimeMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.erik.everyring.screentime
        TARGETED_DEVICE_FAMILY: "1,2"

  # Screen Time report (DeviceActivityReport): draws Apple's own Screen Time history for a Screen Time ring's apps on
  # the ring's page. Sealed by iOS: it can show the numbers but never hand them to the app.
  # An ExtensionKit extension (App Store Connect refuses it as an NSExtension): embedded in Everyring.app/Extensions.
  EveryringScreenTimeReport:
    type: extensionkit-extension
    platform: iOS
    sources: [EveryringScreenTimeReport, Shared/ScreenTime]
    entitlements:
      path: EveryringScreenTimeReport/EveryringScreenTimeReport.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.dk.erik.everyring]
    info:
      path: EveryringScreenTimeReport/Info.plist
      properties:
        CFBundleDisplayName: Everyring Screen Time Report
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.erik.everyring.screentimereport
        TARGETED_DEVICE_FAMILY: "1,2"

  EveryringTests:
    type: bundle.unit-test
    platform: iOS
    sources: [EveryringTests]
    dependencies: [{ target: Everyring }]
    settings:
      base: { GENERATE_INFOPLIST_FILE: YES }
